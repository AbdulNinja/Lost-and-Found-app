<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost &amp; Found</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Lost &amp; Found</h1>
      <p>Report lost or found belongings and help them get back to their owners.</p>
    </div>  
  </header>

  <main class="container layout">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Report an item</h2>
      <form id="item-form" novalidate>
        <fieldset>
          <legend>This item was</legend>
          <label class="radio"><input type="radio" name="type" value="lost" checked> Lost</label>
          <label class="radio"><input type="radio" name="type" value="found"> Found</label>
        </fieldset>

        <label for="name">Item name</label>
        <input type="text" id="name" name="name" maxlength="60" placeholder="e.g. Black backpack">
        <p class="error" data-error-for="name"></p>

        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">Select a category</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Bags">Bags</option>
          <option value="Documents">Documents &amp; IDs</option>
          <option value="Keys">Keys</option>
          <option value="Other">Other</option>
        </select>
        <p class="error" data-error-for="category"></p>

        <label for="location">Location</label>
        <input type="text" id="location" name="location" maxlength="80" placeholder="Where was it lost or found?">
        <p class="error" data-error-for="location"></p>

        <label for="date">Date</label>
        <input type="date" id="date" name="date">
        <p class="error" data-error-for="date"></p>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" maxlength="300" placeholder="Colour, brand, marks, anything that identifies it"></textarea>
        <p class="error" data-error-for="description"></p>

        <label for="contact">Contact (phone or email)</label>
        <input type="text" id="contact" name="contact" maxlength="80">
        <p class="error" data-error-for="contact"></p>

        <button type="submit" id="submit-btn" class="btn btn-primary">Submit report</button>
        <button type="button" id="cancel-edit" class="btn btn-secondary" hidden>Cancel editing</button>
      </form>
    </section>

    <section aria-labelledby="listings-heading">
      <h2 id="listings-heading">Listings</h2>

      <form id="filters" class="filters" role="search" aria-label="Search and filter items">
        <input type="search" id="search" placeholder="Search by name, location or description" aria-label="Search items">
        <select id="filter-type" aria-label="Filter by type">
          <option value="all">Lost &amp; Found</option>
          <option value="lost">Lost only</option>
          <option value="found">Found only</option>
        </select>
        <select id="filter-category" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Bags">Bags</option>
          <option value="Documents">Documents &amp; IDs</option>
          <option value="Keys">Keys</option>
          <option value="Other">Other</option>
        </select>
        <select id="filter-status" aria-label="Filter by status">
          <option value="all">Any status</option>
          <option value="active">Still missing / unclaimed</option>
          <option value="recovered">Recovered</option>
        </select>
      </form>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <div id="item-list" class="item-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Lost &amp; Found &middot; data is stored through a REST API</div>
  </footer>
  <template id="item-template">
    <article class="card">
      <div class="card-top">
        <span class="badge badge-type"></span>
        <span class="badge badge-status" hidden>Recovered</span>
      </div>
      <h3 class="card-title"></h3>
      <p class="card-meta"></p>
      <p class="card-desc"></p>
      <p class="card-contact"></p>
      <div class="card-actions">
        <button type="button" class="btn btn-success" data-action="recover">Mark recovered</button>
        <button type="button" class="btn btn-secondary" data-action="edit">Edit</button>
        <button type="button" class="btn btn-danger" data-action="delete">Delete</button>
      </div>
    </article>
  </template>
</body>
</html>
